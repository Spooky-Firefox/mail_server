apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail-tls
  namespace: mail
spec:
  secretName: mail-tls
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
    - mail.ronstad.se
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
